name: Development branch checks (no deployment)
on:
  push:
    branches: [feat/usable-four-20261030]
  pull_request:
permissions:
  contents: read
jobs:
  local-product:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Core task and boundary checks (no API calls)
        run: npm run test:simulation
      - run: npm run build
